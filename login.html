<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="author" content="Untree.co">
  <link rel="shortcut icon" href="favicon.png">

  <meta name="description" content="" />
  <meta name="keywords" content="bootstrap, bootstrap4" />

  <!-- Bootstrap CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="css/tiny-slider.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Furni | Login</title>
</head>

<body class="login-page">
  <!-- Start Header/Navigation -->
  <nav class="custom-navbar navbar navbar navbar-expand-md navbar-dark bg-dark" arial-label="Furni navigation bar">
    <div class="container">
      <a class="navbar-brand" href="index.html">Furni<span>.</span></a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsFurni" aria-controls="navbarsFurni" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarsFurni">
        <ul class="custom-navbar-nav navbar-nav ms-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li><a class="nav-link" href="shop.html">Shop</a></li>
          <li><a class="nav-link" href="about.html">About us</a></li>
          <li><a class="nav-link" href="services.html">Services</a></li>
          <li><a class="nav-link" href="blog.html">Blog</a></li>
          <li><a class="nav-link" href="contact.html">Contact us</a></li>
        </ul>

        <ul class="custom-navbar-cta navbar-nav mb-2 mb-md-0 ms-5">
          <li><a class="nav-link" href="login.html" aria-label="User account"><img src="images/user.svg" alt="User"></a></li>
          <li><a class="nav-link" href="cart.html" aria-label="Shopping cart"><img src="images/cart.svg" alt="Cart"></a></li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- End Header/Navigation -->

  <main class="login-shell">
    <div class="login-card">
      <div class="login-form">
        <p class="login-kicker">Furni Member Access</p>
        <h1>Welcome back</h1>
        <p class="login-subtitle">Please enter your details to continue.</p>

        <form class="login-fields" id="loginForm">
          <label class="login-label" for="loginEmail">Email address</label>
          <input id="loginEmail" class="login-input" type="email" placeholder="you@example.com" autocomplete="email" required>

          <label class="login-label" for="loginPassword">Password</label>
          <input id="loginPassword" class="login-input" type="password" placeholder="Your password" autocomplete="current-password" required>

          <div class="login-meta">
            <label class="login-check">
              <input type="checkbox" checked>
              <span>Remember for 30 days</span>
            </label>
            <a class="login-link" href="#">Forgot password</a>
          </div>

          <button class="login-button" type="submit">Sign in</button>
          <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
          <button class="login-alt" type="button">
            <i class="fa-brands fa-google"></i>
            Sign in with Google
          </button>

          <p class="login-footer">Don't have an account? <a class="login-link" href="#">Sign up</a></p>
        </form>
      </div>

      <div class="login-panel">
        <div class="panel-badge">
          <span class="dot"></span>
          <span>Secure Login</span>
        </div>
        <div class="panel-illustration">
          <img src="images/person-1.png" alt="User illustration">
          <div class="panel-card">
            <div class="panel-icon">
              <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <div>
              <p class="panel-title">Smart cart</p>
              <p class="panel-text">Track your favorites and fast checkout.</p>
            </div>
          </div>
        </div>
        <div class="panel-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/tiny-slider.js"></script>
  <script src="js/custom.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
